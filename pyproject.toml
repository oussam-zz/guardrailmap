[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oussam-zz-guardrailmap"
version = "0.1.0"
description = "把散落在代码与提示词里的约束整理成清单，标出未覆盖与相互冲突的条目。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "oussam-zz" }]
keywords = ["safety", "guardrails", "audit", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://oussam-zz.github.io"
Repository = "https://github.com/oussam-zz/guardrailmap"
Issues = "https://github.com/oussam-zz/guardrailmap/issues"

[project.scripts]
guardrailmap = "guardrailmap:main"

[tool.setuptools]
py-modules = ["guardrailmap"]
